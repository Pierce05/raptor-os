server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied same-origin from the browser's point of view, so no CORS
    # dance is needed in production -- the browser only ever talks to
    # this nginx origin. "app" is the backend service name on the
    # docker-compose network.
    location /api/ {
        proxy_pass proxy_pass https://raptor-os.onrender.com/api/;;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Session cookie must survive the proxy hop unmodified.
        proxy_pass_request_headers on;
    }

    # SPA fallback: any non-API, non-file route resolves to index.html
    # so client-side routing (react state-based routing) works on
    # refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
