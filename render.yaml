services:
  - type: web
    name: raptor-os-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raptor-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BALLOT_SEED
        generateValue: true
      - key: RECORD_SIGNING_KEY
        generateValue: true
      - key: FIXTURES_PATH
        value: /app/fixtures.json
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: raptor-os-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile

databases:
  - name: raptor-db
    plan: free
